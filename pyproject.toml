[project]
name = "llm-service"
version = "0.1.0"
description = "FastAPI-сервис для LLM: chat-история, стриминг, модерация, rate-limit, admin-API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "redis>=5.0",
    "tenacity>=8.2",
    "aiofiles>=23",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tiktoken>=0.7",
    "structlog>=24",
    "aiogram>=3.10",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "telegramify-markdown>=0.5",
    "qdrant-client>=1.14,<1.16",
    "tqdm>=4.66",
    "llama-index>=0.14.22",
    "llama-index-vector-stores-qdrant>=0.8.8",
    "llama-index-readers-file>=0.6.0",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite>=2.1",
    "langgraph-checkpoint-postgres>=2.1",
    "aiosqlite>=0.20",
    "psycopg[binary,pool]>=3.2",
     "pybotx>=0.55.3",
]

[project.optional-dependencies]
# Трейсинг LlamaIndex в Phoenix — runtime-путь, по умолчанию выключен
# (PHOENIX_ENABLED=false). Ставится отдельно: `uv sync --extra tracing` или
# `pip install '.[tracing]'`. Без него сервис работает, просто без спанов.
tracing = [
    "openinference-instrumentation-llama-index>=3,<4",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# Офлайн-оценка качества RAG (scripts/run_eval.py, generate_testset.py) — тяжёлая
# группа, в проде не нужна. Ставится: `uv sync --extra eval`. langchain-community
# тянется ядром RAGAS; без верхней границы свежие 0.4.x ломают импорт vertexai.
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
    "anthropic>=0.40",
    "llama-index-llms-anthropic>=0.3",
    "pandas>=2",
    "arize-phoenix>=5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
