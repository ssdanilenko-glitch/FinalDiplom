services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:dev
    container_name: llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # В environment кладём ТОЛЬКО те значения, которые в docker-сети
    # отличаются от того, что пользователь ставит в .env (имена hosts).
    # Остальное (токены, флаги, числовые настройки) читает pydantic-settings
    # из .env с дефолтами в Settings.
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://chat:${POSTGRES_PASSWORD:-chat}@postgres:5432/chat
      BOT_URL: http://bot:9000
      QDRANT_URL: http://qdrant:6333
      # Трейсинг включается флагом; эндпоинт указывает на сервис phoenix в сети compose.
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else sys.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: llm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:dev
    container_name: chat-bot
    restart: unless-stopped
    env_file:
      - .env
    # В environment — только сетевые host'ы для docker-сети. Остальное
    # (BOT_TOKEN, ADMIN_TOKEN, INTERNAL_TOKEN, BOT_ADMIN_IDS, ADMIN_CHAT_ID,
    # BOT_API_PORT) читает pydantic-settings из .env.
    environment:
      BACKEND_URL: http://app:8000
    # /notify нужен только из app-сервиса по внутренней сети compose,
    # наружу не пробрасываем. Для отладки с хоста — добавить `ports: ["9000:9000"]`.
    expose:
      - "9000"
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "bot"]

  postgres:
    image: postgres:16
    container_name: llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: llm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Трейсинг RAG: UI + OTLP-приёмник на :6006. Спаны прилетают, только когда в
  # app выставлен PHOENIX_ENABLED=true (по умолчанию трейсинг выключен).
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: llm-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  redis_data:
  pg_data:
  qdrant_storage:
  phoenix_data:
